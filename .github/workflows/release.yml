name: Release

on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify version and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require a version tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Release runs must target a vX.Y.Z tag."
            exit 1
          fi
          expected="v$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${expected}."
            exit 1
          fi

  package:
    name: Package ${{ matrix.label }}
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            command: npm run build:mac
            artifact: macos-installers
          - os: windows-latest
            label: Windows
            command: npm run build:win
            artifact: windows-installer
          - os: ubuntu-latest
            label: Linux
            command: npm run build:linux
            artifact: linux-appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build installers
        run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-installer*'
          path: release-assets
          merge-multiple: true
      - name: Include Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-appimage
          path: release-assets
      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "Flashlight ${GITHUB_REF_NAME}"
          fi
